<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasileirão Betano — Início</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>
<div id="topbar-slot"></div>

<main class="container">

  <div class="hero">
    <div class="tag">🏆🇧🇷 Boas Vindas ao</div>
    <h1>Brasileirão<br>Betano</h1>
    <p>Classificação, jogos e estatísticas do campeonato em tempo real, direto do save da sua liga.</p>
    <div class="hero-actions">
      <button class="btn btn-primary" onclick="location.href='jogos.html'">Ver jogos</button>
      <button class="btn btn-secondary" onclick="location.href='classificacao.html'">Classificação</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="num" id="totalTimes">–</div><div class="label">Times</div></div>
    <div class="stat-card"><div class="num" id="rodadaAtual">–</div><div class="label">Rodada</div></div>
    <div class="stat-card"><div class="num" id="pontosLider">–</div><div class="label">Pts. líder</div></div>
    <div class="stat-card"><div class="num" id="totalGols">–</div><div class="label">Gols</div></div>
  </div>

  <div class="section-title">
    <h2>Próximos jogos</h2>
    <a class="see-all" href="jogos.html">Ver tudo</a>
  </div>
  <div id="proximosJogos">
    <div class="skeleton" style="height:120px;margin-bottom:12px;"></div>
    <div class="skeleton" style="height:120px;"></div>
  </div>

  <div class="section-title">
    <h2>Classificação</h2>
    <a class="see-all" href="classificacao.html">Tabela completa</a>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>#</th><th>Time</th><th>PTS</th><th>J</th><th>V</th><th>E</th><th>D</th><th>SG</th></tr>
      </thead>
      <tbody id="classificacaoHome"></tbody>
    </table>
  </div>

</main>

<div id="bottomnav-slot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="layout.js"></script>
<script src="home.js"></script>

</body>
</html>
