<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diagnóstico</title>
<style>
  body{ font-family: monospace; background:#0a0d12; color:#eee; padding:20px; font-size:14px; line-height:1.6; }
  .ok{ color:#3ddc84; }
  .erro{ color:#e5484d; }
  .box{ background:#1a2029; padding:14px; border-radius:10px; margin-bottom:12px; white-space:pre-wrap; word-break:break-all; }
  button{ background:#3ddc84; border:none; padding:14px 20px; border-radius:8px; font-weight:bold; font-size:15px; width:100%; margin-top:10px; }
  input{ width:100%; padding:12px; margin-top:8px; border-radius:8px; border:1px solid #333; background:#12161d; color:#eee; }
</style>
</head>
<body>

<h2>Diagnóstico de login</h2>
<div id="passo1" class="box">1. Carregando biblioteca Supabase...</div>
<div id="passo2" class="box">2. Aguardando...</div>

<div id="testeLogin" style="display:none;">
  <p>Teste de login:</p>
  <input type="email" id="email" placeholder="email" value="lv196814@gmail.com">
  <input type="password" id="senha" placeholder="senha">
  <button onclick="testarLogin()">Testar login agora</button>
  <div id="resultadoLogin" class="box" style="margin-top:14px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script>
  const p1 = document.getElementById('passo1');
  const p2 = document.getElementById('passo2');

  try {
    if (typeof supabase === 'undefined') {
      p1.innerHTML = '<span class="erro">❌ ERRO: a biblioteca Supabase não carregou (sem internet, CDN bloqueado, ou adblock).</span>';
    } else {
      p1.innerHTML = '<span class="ok">✅ Biblioteca Supabase carregada.</span>';

      const SUPABASE_URL = "https://sqzcopngvynuuqgipest.supabase.co";
      const SUPABASE_KEY = "sb_publishable_eYNxMi3iCfpwnDF2D7ai0A_dn_KKkC_";

      const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

      p2.innerHTML = '<span class="ok">✅ Cliente criado com sucesso. URL: ' + SUPABASE_URL + '</span>';
      document.getElementById('testeLogin').style.display = 'block';

      window.__client = client;
    }
  } catch (e) {
    p1.innerHTML = '<span class="erro">❌ ERRO ao carregar: ' + e.message + '</span>';
  }

  async function testarLogin() {
    const resultado = document.getElementById('resultadoLogin');
    resultado.innerHTML = 'Testando...';

    const email = document.getElementById('email').value;
    const senha = document.getElementById('senha').value;

    try {
      const { data, error } = await window.__client.auth.signInWithPassword({ email, password: senha });

      if (error) {
        resultado.innerHTML = '<span class="erro">❌ ERRO DO SUPABASE:\n\n' + error.message + '\n\n(status: ' + (error.status || '?') + ')</span>';
        return;
      }

      resultado.innerHTML = '<span class="ok">✅ LOGIN FUNCIONOU!\n\nUser ID: ' + data.user.id + '\nEmail: ' + data.user.email + '</span>';
    } catch (e) {
      resultado.innerHTML = '<span class="erro">❌ ERRO DE JAVASCRIPT (exception):\n\n' + e.message + '\n\n' + (e.stack || '') + '</span>';
    }
  }
</script>

</body>
</html>
