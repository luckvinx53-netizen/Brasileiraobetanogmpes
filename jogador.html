<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogador — Brasileirão PES</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>
<div id="topbar-slot"></div>

<main class="container">
  <div id="cabecalhoJogador">
    <div class="skeleton" style="height:120px;"></div>
  </div>

  <div class="section-title">
    <h2>Estatísticas na temporada</h2>
  </div>
  <div class="stat-grid" id="statsGridJogador"></div>

  <div class="section-title">
    <h2>Histórico de transferências</h2>
  </div>
  <div class="list" id="listaHistoricoJogador">
    <div class="skeleton" style="height:70px;"></div>
  </div>

  <div class="section-title">
    <h2>Rumores</h2>
  </div>
  <div class="list" id="listaRumoresJogador">
    <div class="skeleton" style="height:70px;"></div>
  </div>
</main>

<div id="bottomnav-slot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase-config.js"></script>
<script src="utils.js"></script>
<script src="layout.js"></script>
<script src="bid.js"></script>
<script src="mercado-noticias.js"></script>
<script src="jogador.js"></script>

</body>
</html>
