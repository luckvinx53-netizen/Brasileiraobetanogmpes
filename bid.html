<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  // Gate: se ainda não há campeonato escolhido, manda pra tela de
  // seleção antes de renderizar a página (evita cair direto numa
  // página interna sem competição definida).
  if (!localStorage.getItem("competicaoSelecionadaSlug")) {
    window.location.replace("selecionar-competicao");
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BID — Transferências | Brasileirão PES</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast"></div>
<div id="topbar-slot"></div>

<main class="container">
  <div class="section-title">
    <h2>BID <span class="text-dim" style="font-weight:400;font-size:14px;">Transferências confirmadas</span></h2>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <p class="text-dim" style="font-size:12.5px;margin-top:-4px;">
      Selecione um time para ver todas as transferências já confirmadas envolvendo ele,
      como comprador ou vendedor.
    </p>
    <div class="field">
      <label>Time</label>
      <select id="timeBidSelect" onchange="carregarTransferenciasBidPublico()"></select>
    </div>
  </div>

  <div class="list" id="listaTransferenciasBid">
    <p class="text-dim" style="font-size:13px;">Escolha um time para ver as transferências.</p>
  </div>
</main>

<div id="bottomnav-slot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="supabase-config.js"></script>
<script src="competicoes.js"></script>
<script src="utils.js"></script>
<script src="layout.js"></script>
<script src="bid-publico.js"></script>

</body>
</html>
